<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoanAppraise</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="loan-officer-modern.css?v=20260828-1"><link rel="stylesheet" href="loan-officer-clean.css?v=20260829-6"></head><body><div id="loginScreen" class="login-screen"><div class="login-card"><h1>Loan<span>Appraise</span></h1><p>Secure loan origination, KYC, appraisal and approval.</p><form id="loginForm"><label>Email<input id="loginEmail" type="email" required></label><label>Password<input id="loginPassword" type="password" required></label><p id="loginError" class="login-error"></p><button class="primary" type="submit">Sign In</button></form></div></div><div id="appShell" class="app-shell hidden"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=20260829-1"></script><script>window.addEventListener('DOMContentLoaded',function(){var f=document.getElementById('loginForm');if(!f)return;f.addEventListener('submit',async function(e){e.preventDefault();var err=document.getElementById('loginError');err.textContent='';try{var sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);var r=await sb.auth.signInWithPassword({email:document.getElementById('loginEmail').value.trim(),password:document.getElementById('loginPassword').value});if(r.error)throw r.error;document.getElementById('loginScreen').classList.add('hidden');window.dispatchEvent(new Event('loanOfficerReady'));}catch(x){err.textContent=x.message||'Unable to sign in.';}});});</script><script src="loan-officer-clean.js?v=20260829-6"></script><script src="loan-officer-login-bridge.js?v=20260829-3"></script><script src="loan-officer-isolation.js?v=20260829-3"></script></body></html>
